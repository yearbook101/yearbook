<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yearbook · Printable QR Codes</title>
  <style>
    @page { margin: 0.55in; }
    body { font-family: Georgia, serif; color: #132238; margin: 24px; }
    h1 { font-size: 1.45rem; margin: 0 0 4px; }
    .sub { color: #555; margin: 0 0 20px; font-size: 0.92rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 16px; }
    figure { margin: 0; text-align: center; page-break-inside: avoid; }
    img { width: 160px; height: 160px; }
    figcaption { margin-top: 8px; font-size: 0.86rem; line-height: 1.35; }
    code { font-size: 0.78rem; }
    .hint { margin-top: 24px; font-size: 0.85rem; color: #666; max-width: 60ch; }
    @media print {
      body { margin: 0; }
      .noprint { display: none; }
    }
  </style>
</head>
<body>
  <h1>Banner Christian School · yearbook</h1>
  <p class="sub">Printable QR sheet · targets https://yearbook101.github.io/yearbook/go/…</p>
  <p class="noprint"><button onclick="window.print()">Print this page</button></p>
  <div class="grid">
    
    <figure>
      <img src="campus.svg" alt="QR for Campus" width="160" height="160" />
      <figcaption><strong>Campus</strong><br/><code>/go/campus/</code></figcaption>
    </figure>
    <figure>
      <img src="classes.svg" alt="QR for Classes" width="160" height="160" />
      <figcaption><strong>Classes</strong><br/><code>/go/classes/</code></figcaption>
    </figure>
    <figure>
      <img src="events.svg" alt="QR for Events" width="160" height="160" />
      <figcaption><strong>Events</strong><br/><code>/go/events/</code></figcaption>
    </figure>
    <figure>
      <img src="pickleball.svg" alt="QR for Pickleball" width="160" height="160" />
      <figcaption><strong>Pickleball</strong><br/><code>/go/pickleball/</code></figcaption>
    </figure>
    <figure>
      <img src="track.svg" alt="QR for Track" width="160" height="160" />
      <figcaption><strong>Track</strong><br/><code>/go/track/</code></figcaption>
    </figure>
    <figure>
      <img src="basketball.svg" alt="QR for Basketball" width="160" height="160" />
      <figcaption><strong>Basketball</strong><br/><code>/go/basketball/</code></figcaption>
    </figure>
    <figure>
      <img src="clubs.svg" alt="QR for Clubs" width="160" height="160" />
      <figcaption><strong>Clubs</strong><br/><code>/go/clubs/</code></figcaption>
    </figure>
    <figure>
      <img src="messages.svg" alt="QR for Messages" width="160" height="160" />
      <figcaption><strong>Messages</strong><br/><code>/go/messages/</code></figcaption>
    </figure>
    <figure>
      <img src="videos.svg" alt="QR for Videos" width="160" height="160" />
      <figcaption><strong>Videos</strong><br/><code>/go/videos/</code></figcaption>
    </figure>
  </div>
  <p class="hint">Print tip: keep each code at least ~2×2 cm. Test-scan before sending the book to print.</p>
</body>
</html>
